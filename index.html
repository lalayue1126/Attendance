<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<title>Time Clock</title>
<style>
  :root{
    --ink:#16202B;
    --ink-soft:#3A4753;
    --muted:#6B7780;
    --line:#D8DEDC;
    --paper:#EFF2F1;
    --card:#FFFFFF;
    --ok:#0F6E4F;
    --ok-bg:#E4F1EB;
    --warn:#9A4C15;
    --warn-bg:#FBEEE2;
    --err:#9B2C2C;
    --err-bg:#FBEAEA;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.6;
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:420px;margin:0 auto;padding:0 16px 40px}

  /* ── Location band ── */
  .band{
    background:var(--ink);color:#fff;
    margin:0 -16px 20px;padding:18px 20px 16px;
  }
  .band .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:#8FA2B0;margin:0 0 4px;
  }
  .band .place{font-size:21px;font-weight:600;margin:0;line-height:1.3}

  /* ── General ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
  h2{font-size:17px;font-weight:600;margin:0 0 6px}
  .note{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.55}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
  input{
    width:100%;padding:14px;font-size:17px;font-family:var(--mono);
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  input:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  .field{margin-bottom:14px}

  button{
    font-family:inherit;font-size:17px;font-weight:600;
    border-radius:10px;border:1px solid transparent;
    cursor:pointer;width:100%;
  }
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  button:disabled{opacity:.45;cursor:not-allowed}

  .section-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 8px}

  /* ── Selectable buttons (tapping only selects; it does not submit) ── */
  .btn-toggle{
    min-height:64px;padding:12px;background:#fff;color:var(--ink-soft);
    border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .btn-toggle .sub{font-size:11.5px;font-weight:400;color:var(--muted);font-family:var(--mono)}
  .btn-toggle.selected{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-toggle.selected .sub{color:#9FB1BE}

  .btn-punch{flex:1 1 0;min-height:76px}

  .loc-row{margin-bottom:6px}
  .btn-loc{flex:1 1 auto;min-width:0;min-height:48px;padding:10px;font-size:14.5px;font-weight:500}

  .btn-submit{min-height:56px;background:var(--ink);color:#fff;margin-top:4px}
  .btn-submit:disabled{opacity:.35}

  .btn-sm{min-height:48px;padding:12px;background:#fff;border-color:var(--line);color:var(--ink-soft);font-size:14.5px;font-weight:500}
  .btn-primary{min-height:54px;background:var(--ink);color:#fff}
  .btn-text{min-height:44px;background:none;border:none;color:var(--muted);font-size:14px;font-weight:500;text-decoration:underline}

  /* ── Location status ── */
  .geo{
    display:flex;align-items:flex-start;gap:9px;
    padding:11px 13px;border-radius:8px;margin-bottom:16px;
    font-size:13.5px;line-height:1.5;
  }
  .geo .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:6px}
  .geo.pending{background:#E9EDEC;color:var(--ink-soft)}
  .geo.pending .dot{background:var(--muted);animation:pulse 1.1s ease-in-out infinite}
  .geo.ok{background:var(--ok-bg);color:var(--ok)}
  .geo.ok .dot{background:var(--ok)}
  .geo.warn{background:var(--warn-bg);color:var(--warn)}
  .geo.warn .dot{background:var(--warn)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ── Done screen: time-card stub ── */
  .stub{
    position:relative;background:var(--card);
    border:1px solid var(--line);border-left:none;border-radius:0 10px 10px 0;
    padding:22px 20px 20px 26px;margin-left:11px;
  }
  .stub::before{
    content:"";position:absolute;left:-11px;top:0;bottom:0;width:11px;
    border:1px solid var(--line);border-right:none;border-radius:10px 0 0 10px;
    background:
      radial-gradient(circle at 0 50%, transparent 0 5px, var(--line) 5px 6px, var(--card) 6px) no-repeat,
      var(--card);
    background-size:100% 30px;background-repeat:repeat-y;
  }
  .stamp{
    display:inline-block;padding:4px 12px;border:2px solid currentColor;border-radius:4px;
    font-size:14px;font-weight:700;letter-spacing:.1em;margin-bottom:14px;
  }
  .stamp.in{color:var(--ok)}
  .stamp.out{color:var(--ink)}
  .clock{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1;margin:0}
  .date{font-family:var(--mono);font-size:13.5px;color:var(--muted);margin:7px 0 18px}
  .meta{border-top:1px solid var(--line);padding-top:13px;font-size:13.5px}
  .meta div{display:flex;justify-content:space-between;gap:14px;padding:3px 0}
  .meta dt{color:var(--muted)}
  .meta dd{margin:0;text-align:right;font-family:var(--mono);color:var(--ink-soft)}

  .msg{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px;line-height:1.55}
  .msg.err{background:var(--err-bg);color:var(--err)}
  .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .hide{display:none}
  .center{text-align:center}
  .spacer{height:14px}
  .who{font-size:13.5px;color:var(--muted);margin:0 0 14px;font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">

  <!-- Location band -->
  <div class="band" id="band">
    <p class="eyebrow" id="locId">Loading</p>
    <p class="place" id="locName">&nbsp;</p>
  </div>

  <!-- Booting -->
  <section id="scr-boot" class="card center">
    <p class="note" style="margin:0">Preparing…</p>
  </section>

  <!-- Device registration -->
  <section id="scr-register" class="card hide">
    <h2>Register This Device</h2>
    <p class="note">This is a one-time setup. After this, just tap to check in or out.</p>
    <div id="reg-msg"></div>
    <div class="field">
      <label for="f-code">Employee Code</label>
      <input id="f-code" type="text" inputmode="latin" autocapitalize="characters"
             autocomplete="off" placeholder="E001">
    </div>
    <div class="field">
      <label for="f-pin">PIN</label>
      <input id="f-pin" type="password" inputmode="numeric" autocomplete="off"
             maxlength="8" placeholder="••••">
    </div>
    <button class="btn-primary" id="btn-register">Register</button>
  </section>

  <!-- Punch -->
  <section id="scr-punch" class="hide">
    <p class="who" id="who">&nbsp;</p>
    <div class="geo pending" id="geo"><span class="dot"></span><span id="geo-text">Getting your location…</span></div>
    <div id="punch-msg"></div>

    <p class="section-label">Practice Location</p>
    <div class="row loc-row" id="practice-row"></div>

    <p class="section-label">Check In / Out</p>
    <div class="row" style="margin-bottom:14px">
      <button class="btn-toggle btn-punch" id="btn-in">Check In<span class="sub" id="sub-in"></span></button>
      <button class="btn-toggle btn-punch" id="btn-out">Leave Early<span class="sub" id="sub-out"></span></button>
    </div>

    <button class="btn-submit" id="btn-submit" disabled>Submit</button>

    <div class="spacer"></div>
    <button class="btn-text" id="btn-reset">Register as a different person</button>
  </section>

  <!-- Done -->
  <section id="scr-done" class="hide">
    <div class="stub">
      <span class="stamp" id="d-stamp">Recorded</span>
      <p class="clock" id="d-time">--:--</p>
      <p class="date" id="d-date"></p>
      <dl class="meta" id="d-meta"></dl>
    </div>
    <div class="spacer"></div>
    <div id="done-msg"></div>
    <button class="btn-text" id="btn-again">Check in/out again</button>
  </section>

  <!-- Error -->
  <section id="scr-error" class="card hide">
    <h2 id="e-title">Couldn't Open</h2>
    <p class="note" id="e-body"></p>
    <button class="btn-primary" id="btn-retry">Try Again</button>
  </section>

</div>

<script>
/* ══════════════════════════════════════════
   Config — edit only this block
   ══════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzevhLv-1CXcH3yhRgHTt6v1vQ7opNhP1dEkQzmni_x6tAXnCOIbShW4pjd9Mjs882EBQ/exec',
  GEO_TIMEOUT_MS: 10000,
  FETCH_TIMEOUT_MS: 25000
};

const TOKEN_KEY = 'punch.token';
const QUEUE_KEY = 'punch.queue';
const LOC_CACHE_KEY = 'punch.practiceLocations';

/* ── Helpers ─────────────────────────── */
const $ = id => document.getElementById(id);
const TYPE_LABEL = { IN:'Check In', OUT:'Leave Early' };

function show(name){
  ['boot','register','punch','done','error'].forEach(s =>
    $('scr-'+s).classList.toggle('hide', s !== name));
}
function setMsg(el, text, kind){
  el.innerHTML = text ? `<div class="msg ${kind||'err'}">${esc(text)}</div>` : '';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uuid(){
  if (self.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'x-' + Date.now() + '-' + Math.random().toString(36).slice(2, 11);
}
function store(key, val){
  try { val === null ? localStorage.removeItem(key) : localStorage.setItem(key, val); }
  catch(e) { /* Not persisted in private browsing, etc. */ }
}
function load(key){
  try { return localStorage.getItem(key); } catch(e) { return null; }
}

/* ── Networking ────────────────────────────
   The key point is using Content-Type: text/plain.
   application/json would make the browser send a preflight
   OPTIONS request first, which GAS can't handle, so it
   always results in a CORS error. */
async function api(payload){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ── Geolocation ───────────────────────── */
function getPosition(){
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve({ status:'UNSUPPORTED' });
    navigator.geolocation.getCurrentPosition(
      p => resolve({
        status:'OK',
        lat: p.coords.latitude,
        lng: p.coords.longitude,
        accuracy: Math.round(p.coords.accuracy)
      }),
      err => resolve({ status: err.code === 1 ? 'DENIED' : 'TIMEOUT' }),
      { enableHighAccuracy:true, timeout: CONFIG.GEO_TIMEOUT_MS, maximumAge:0 }
    );
  });
}

function paintGeo(geo){
  const box = $('geo'), txt = $('geo-text');
  box.className = 'geo';
  if (geo.status === 'OK'){
    box.classList.add(geo.accuracy > 200 ? 'warn' : 'ok');
    txt.textContent = geo.accuracy > 200
      ? `Location accuracy is low (±${geo.accuracy}m). Accuracy improves outdoors.`
      : `Location acquired (±${geo.accuracy}m)`;
  } else if (geo.status === 'DENIED'){
    box.classList.add('warn');
    txt.textContent = 'Location is off. You can still check in/out, but your location won’t be recorded.';
  } else {
    box.classList.add('warn');
    txt.textContent = 'Couldn’t get your location. You can still continue.';
  }
}

/* ── State ────────────────────────────── */
const state = {
  loc:null, token:null, geo:{ status:'PENDING' }, sending:false,
  practiceLocations:[], selectedPracticeLoc:null, selectedType:null
};

/* ── Boot ────────────────────────────── */
async function boot(){
  state.loc = new URLSearchParams(location.search).get('l');
  if (!state.loc){
    $('locId').textContent = '—';
    $('locName').textContent = 'No location specified';
    return fail('Please open this via the tag',
      'This page should be opened by tapping the tag or scanning the QR code. It can’t be used from a bookmark.');
  }
  $('locId').textContent = state.loc;

  flushQueue();                      // Send anything saved offline last time

  state.token = load(TOKEN_KEY);
  if (!state.token){
    $('locName').textContent = 'Device Registration';
    return show('register');
  }
  await openPunch();
}

/* ── Practice location / punch type selection UI ──────
   Tapping a button only selects it; it doesn't submit.
   The actual submission happens when btn-submit is pressed. */
function renderPracticeLocations(){
  const row = $('practice-row');
  row.innerHTML = '';
  state.practiceLocations.forEach(loc => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn-toggle btn-loc';
    b.textContent = loc.label;
    b.dataset.id = loc.id;
    b.onclick = () => selectPracticeLoc(loc.id);
    row.appendChild(b);
  });
  // A location selected before this render (e.g. while the previous list was
  // still showing) only counts if it still exists in the new list.
  if (state.selectedPracticeLoc && !state.practiceLocations.some(loc => loc.id === state.selectedPracticeLoc)) {
    state.selectedPracticeLoc = null;
  }
  paintPracticeLocSelection();
  updateSubmitEnabled();
}
function paintPracticeLocSelection(){
  $('practice-row').querySelectorAll('.btn-loc').forEach(b =>
    b.classList.toggle('selected', b.dataset.id === state.selectedPracticeLoc));
}
function selectPracticeLoc(id){
  state.selectedPracticeLoc = id;
  paintPracticeLocSelection();
  updateSubmitEnabled();
}
function selectType(type){
  state.selectedType = type;
  $('btn-in').classList.toggle('selected', type === 'IN');
  $('btn-out').classList.toggle('selected', type === 'OUT');
  updateSubmitEnabled();
}
function updateSubmitEnabled(){
  $('btn-submit').disabled = !(state.selectedPracticeLoc && state.selectedType) || state.sending;
}

async function openPunch(){
  show('punch');
  setMsg($('punch-msg'), '');
  $('geo').className = 'geo pending';
  $('geo-text').textContent = 'Getting your location…';

  state.selectedPracticeLoc = null;
  state.selectedType = null;
  $('btn-in').classList.remove('selected');
  $('btn-out').classList.remove('selected');
  // Clear any practice-location buttons left over from the previous screen
  // immediately, so they can't be tapped (and desync the selection state)
  // while this screen is still loading.
  $('practice-row').innerHTML = '';
  updateSubmitEnabled();

  getPosition().then(g => { state.geo = g; paintGeo(g); });   // Fetched in parallel

  let r;
  try {
    r = await api({ action:'state', token: state.token, l: state.loc });
  } catch(e){
    $('locName').textContent = 'Offline';
    setMsg($('punch-msg'),
      'Couldn’t connect. You can still check in/out below — it will be saved on this device and sent automatically once you’re back online.', 'warn');
    $('who').textContent = 'Offline';
    // No live location list available offline — fall back to the list from
    // the last successful load, so offline check-in/out still works.
    state.practiceLocations = JSON.parse(load(LOC_CACHE_KEY) || '[]');
    renderPracticeLocations();
    if (!state.practiceLocations.length){
      setMsg($('punch-msg'),
        'Couldn’t connect, and no practice locations are saved on this device yet. Please open this page once while online before using it offline.', 'err');
    } else {
      selectType('IN');
    }
    return;
  }

  if (!r.ok){
    if (r.error === 'AUTH'){
      store(TOKEN_KEY, null);
      $('locName').textContent = 'Device Registration';
      setMsg($('reg-msg'), 'This device’s registration has been revoked. Please register again.', 'warn');
      return show('register');
    }
    if (r.error === 'BAD_MODE'){
      $('locName').textContent = 'Invalid Link';
      return fail('This Link Is Invalid',
        'Please open the correct link provided by your administrator (Fixed or Portable).');
    }
    return fail('Can’t Check In/Out', r.message || 'Please try again in a moment.');
  }

  $('locName').textContent = r.loc_mode_label || state.loc;
  const whoName = r.employee_code ? `${r.name} (${r.employee_code})` : r.name;
  $('who').textContent = whoName + (r.last ? ` · Last: ${r.last.type_label} at ${r.last.at_label}` : ' · No check-ins today yet');

  state.practiceLocations = r.practice_locations || [];
  store(LOC_CACHE_KEY, JSON.stringify(state.practiceLocations));
  renderPracticeLocations();

  // Pre-select the recommended button (this does not submit; it can still be changed)
  selectType(r.suggest || 'IN');
}

/* ── Submit punch ───────────────────────── */
async function submitPunch(){
  if (state.sending || !state.selectedType || !state.selectedPracticeLoc) return;
  const type = state.selectedType;
  const practiceLocId = state.selectedPracticeLoc;

  state.sending = true;
  $('btn-submit').disabled = true;
  setMsg($('punch-msg'), '');

  const job = {
    action:'punch',
    token: state.token,
    l: state.loc,
    type: type,
    practice_loc_id: practiceLocId,
    geo: state.geo.status === 'PENDING' ? { status:'TIMEOUT' } : state.geo,
    client_uuid: uuid(),
    client_time: new Date().toISOString(),
    ua: navigator.userAgent.slice(0, 60)
  };

  let r;
  try {
    r = await api(job);
  } catch(e){
    enqueue(job);                                   // Offline -> save on device
    return done({ ok:true, queued:true, type:type }, job);
  } finally {
    state.sending = false;
    updateSubmitEnabled();
  }

  if (!r.ok){
    if (r.error === 'TOO_SOON'){
      return setMsg($('punch-msg'), 'You just did the same action. Duplicate check-ins aren’t recorded.', 'warn');
    }
    if (r.error === 'BAD_PRACTICE_LOC'){
      return setMsg($('punch-msg'), 'Please select a practice location.', 'warn');
    }
    if (r.error === 'AUTH'){
      store(TOKEN_KEY, null);
      return show('register');
    }
    return setMsg($('punch-msg'), r.message || 'Couldn’t save. Please try again.', 'err');
  }
  done(r, job);
}

/* ── Done screen (time-card stub) ── */
function done(r, job){
  const at = r.punched_at ? new Date(r.punched_at) : new Date();
  const p = n => String(n).padStart(2,'0');
  const week = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][at.getDay()];

  $('d-time').textContent = `${p(at.getHours())}:${p(at.getMinutes())}`;
  $('d-date').textContent = `${at.getFullYear()}.${p(at.getMonth()+1)}.${p(at.getDate())} (${week})`;

  const stamp = $('d-stamp');
  stamp.textContent = TYPE_LABEL[job.type] || 'Recorded';
  stamp.className = 'stamp ' + (job.type === 'IN' ? 'in' : 'out');

  const locLabel = (state.practiceLocations.find(l => l.id === job.practice_loc_id) || {}).label;

  const rows = [['Location', r.loc_name || $('locName').textContent]];
  if (r.practice_loc_label || locLabel) rows.push(['Practice Location', r.practice_loc_label || locLabel]);
  if (job.geo.status === 'OK'){
    rows.push(['GPS', `±${job.geo.accuracy}m`]);
    if (r.distance !== undefined && r.distance !== '') rows.push(['Distance from location', `${r.distance}m`]);
    if (r.address) rows.push(['Address', r.address]);
  } else {
    rows.push(['GPS', 'Not recorded']);
  }
  if (r.day_worked_hours !== undefined && r.day_worked_hours !== ''){
    const min = (r.day_worked_minutes !== undefined && r.day_worked_minutes !== '') ? ` (${r.day_worked_minutes} min)` : '';
    rows.push(["Today's Hours", `${r.day_worked_hours}h${min}`]);
  }
  if (r.scheduled_hours !== undefined && r.scheduled_hours !== '') rows.push(['Scheduled Hours', `${r.scheduled_hours}h`]);
  $('d-meta').innerHTML = rows.map(([k,v]) =>
    `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');

  let msg = '';
  if (r.queued) msg = ['Saved on this device. It will be sent automatically once you’re back online.','warn'];
  else if (r.geo_status === 'OUT_OF_RANGE') msg = ['This check-in was recorded from outside the registered location range. It has still been saved.','warn'];
  setMsg($('done-msg'), msg[0] || '', msg[1]);

  show('done');
}

/* ── Offline queue ───────────────── */
function enqueue(job){
  const q = JSON.parse(load(QUEUE_KEY) || '[]');
  q.push(job);
  store(QUEUE_KEY, JSON.stringify(q));
}
async function flushQueue(){
  const q = JSON.parse(load(QUEUE_KEY) || '[]');
  if (!q.length) return;
  const rest = [];
  for (const job of q){
    try { await api(job); }          // Safe to resend since client_uuid dedupes it
    catch(e){ rest.push(job); }
  }
  store(QUEUE_KEY, rest.length ? JSON.stringify(rest) : null);
}
window.addEventListener('online', flushQueue);

/* ── Registration ────────────────────────────── */
async function register(){
  const code = $('f-code').value.trim().toUpperCase();
  const pin  = $('f-pin').value.trim();
  setMsg($('reg-msg'), '');

  if (!code) return setMsg($('reg-msg'), 'Please enter your employee code.');
  if (!pin)  return setMsg($('reg-msg'), 'Please enter your PIN.');

  const btn = $('btn-register');
  btn.disabled = true; btn.textContent = 'Registering…';
  try {
    const r = await api({ action:'register', employee_code:code, pin:pin,
                          label: navigator.userAgent.slice(0, 40) });
    if (!r.ok){
      const m = { BAD_PIN:'Incorrect PIN.', NOT_FOUND:'This employee code is not registered.' };
      return setMsg($('reg-msg'), m[r.error] || 'Couldn’t register. Please contact your administrator.');
    }
    state.token = r.token;
    store(TOKEN_KEY, r.token);
    $('f-pin').value = '';
    await openPunch();
  } catch(e){
    setMsg($('reg-msg'), 'Couldn’t connect. Please try again somewhere with a better signal.');
  } finally {
    btn.disabled = false; btn.textContent = 'Register';
  }
}

function fail(title, body){
  $('e-title').textContent = title;
  $('e-body').textContent = body;
  show('error');
}

/* ── Wiring ────────────────────────────── */
$('btn-in').onclick  = () => selectType('IN');
$('btn-out').onclick = () => selectType('OUT');
$('btn-submit').onclick = submitPunch;
$('btn-again').onclick = () => openPunch();
$('btn-retry').onclick = () => location.reload();
$('btn-register').onclick = register;
$('f-pin').addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
$('btn-reset').onclick = () => {
  if (confirm('This will unregister this device. Next time, you’ll need to enter your employee code and PIN again.')){
    store(TOKEN_KEY, null);
    location.reload();
  }
};

boot();
</script>
</body>
</html>
