<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<title>Missed-Punch Requests</title>
<style>
  :root{
    --ink:#16202B;
    --ink-soft:#3A4753;
    --muted:#6B7780;
    --line:#D8DEDC;
    --paper:#EFF2F1;
    --card:#FFFFFF;
    --ok:#0F6E4F;
    --ok-bg:#E4F1EB;
    --warn:#9A4C15;
    --warn-bg:#FBEEE2;
    --err:#9B2C2C;
    --err-bg:#FBEAEA;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.6;
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px 40px}

  .back-link{display:inline-block;font-size:13.5px;color:var(--muted);text-decoration:none;margin-bottom:12px}
  .back-link:active{color:var(--ink-soft)}

  .band{background:var(--ink);color:#fff;margin:0 -16px 20px;padding:18px 20px 16px}
  .band .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:#8FA2B0;margin:0 0 4px;
  }
  .band .title{font-size:21px;font-weight:600;margin:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
  h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .note{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.55}

  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
  .field{margin-bottom:14px}
  input,select{
    width:100%;padding:12px;font-size:16px;font-family:inherit;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}

  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab-btn{
    flex:1 1 0;padding:10px;font-size:13.5px;font-weight:600;
    background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink-soft);cursor:pointer;
  }
  .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  button{
    font-family:inherit;font-size:16px;font-weight:600;
    border-radius:10px;border:1px solid transparent;
    cursor:pointer;width:100%;padding:14px;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-secondary{background:#fff;border-color:var(--line);color:var(--ink-soft)}
  .btn-ok{background:#fff;border-color:var(--ok);color:var(--ok)}
  .btn-danger{background:#fff;border-color:var(--err);color:var(--err)}
  .btn-sm{width:auto;padding:8px 14px;font-size:13.5px}

  .msg{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px;line-height:1.55}
  .msg.err{background:var(--err-bg);color:var(--err)}
  .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .hide{display:none}
  .spacer{height:12px}

  .req-list{display:flex;flex-direction:column;gap:10px}
  .req-card{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .req-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  .req-name{font-weight:600;font-size:14.5px}
  .req-date{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .req-detail{font-size:13.5px;color:var(--ink-soft);margin-bottom:4px}
  .req-reason{font-size:13.5px;color:var(--muted);margin-bottom:8px;line-height:1.5}
  .req-status{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;margin-bottom:8px;
  }
  .req-status.PENDING{background:var(--warn-bg);color:var(--warn)}
  .req-status.APPROVED{background:var(--ok-bg);color:var(--ok)}
  .req-status.REJECTED{background:var(--err-bg);color:var(--err)}
  .req-review{font-size:12.5px;color:var(--muted);margin-top:6px}
  .req-actions{display:flex;gap:8px}

  .subform{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
  .subform .field{margin-bottom:10px}
  .subform-actions{display:flex;gap:8px}
  .subform-actions button{flex:1 1 0}
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="admin.html">← Admin</a>

  <div class="band">
    <p class="eyebrow">Admin only</p>
    <p class="title">Missed-Punch Requests</p>
  </div>

  <!-- Step 1: unlock -->
  <section id="scr-lock" class="card">
    <h2>Password</h2>
    <p class="note">Same password as the other admin tools.</p>
    <div id="lock-msg"></div>
    <div class="field">
      <input id="f-password" type="password" autocomplete="off" placeholder="Admin password">
    </div>
    <button class="btn-primary" id="btn-unlock">Unlock</button>
  </section>

  <!-- Step 2: main -->
  <section id="scr-main" class="hide">

    <div class="card">
      <h2>Your name</h2>
      <p class="note">Recorded on every approval/rejection you make.</p>
      <div class="field">
        <input id="f-reviewed-by" type="text" placeholder="e.g. Coach Yusuke">
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button type="button" class="tab-btn active" data-status="PENDING">Pending</button>
        <button type="button" class="tab-btn" data-status="ALL">All</button>
      </div>
      <div id="list-msg"></div>
      <div class="req-list" id="req-list"></div>
      <div class="spacer"></div>
      <button class="btn-secondary" id="btn-refresh">Refresh</button>
    </div>

    <button class="btn-secondary" id="btn-relock">Lock again</button>
  </section>

</div>

<script>
/* ══════════════════════════════════════════
   Config — same backend as index.html / other admin tools
   ══════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzevhLv-1CXcH3yhRgHTt6v1vQ7opNhP1dEkQzmni_x6tAXnCOIbShW4pjd9Mjs882EBQ/exec',
  FETCH_TIMEOUT_MS: 25000
};

const $ = id => document.getElementById(id);

function show(name){
  $('scr-lock').classList.toggle('hide', name !== 'lock');
  $('scr-main').classList.toggle('hide', name !== 'main');
}
function setMsg(el, text, kind){
  el.innerHTML = text ? `<div class="msg ${kind||'err'}">${esc(text)}</div>` : '';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(payload){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

const ERROR_MESSAGES = {
  BAD_PASSWORD: 'Incorrect password — please lock and unlock again.',
  BAD_REQUEST: 'Something was missing from that request.',
  NOT_FOUND: 'That request could no longer be found.',
  BAD_LOCATION: 'That practice location no longer exists — please reject and ask the player to resubmit.',
  NO_REASON: 'Please enter a reason.',
  ALREADY_REVIEWED: 'This request has already been reviewed.'
};

const state = { password: '', status: 'PENDING' };

/* ── Your name: remembered on this device between visits ── */
try {
  const savedName = localStorage.getItem('requests.reviewedBy');
  if (savedName) $('f-reviewed-by').value = savedName;
} catch(e) {}
$('f-reviewed-by').addEventListener('change', () => {
  try { localStorage.setItem('requests.reviewedBy', $('f-reviewed-by').value.trim()); } catch(e) {}
});
function reviewedBy(){ return $('f-reviewed-by').value.trim(); }

/* ── Step 1: unlock ───────────────────── */
async function unlock(){
  const pw = $('f-password').value;
  if (!pw) return setMsg($('lock-msg'), 'Please enter the admin password.');

  const btn = $('btn-unlock');
  btn.disabled = true; btn.textContent = 'Checking…';
  setMsg($('lock-msg'), '');

  try {
    const r = await api({ action:'list_requests', password: pw, status: state.status });
    if (!r.ok){
      return setMsg($('lock-msg'), ERROR_MESSAGES[r.error] || r.message || 'Something went wrong.');
    }
    state.password = pw;
    show('main');
    renderList(r.requests);
  } catch(e){
    setMsg($('lock-msg'), 'Couldn’t connect. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

/* ── Tabs ───────────────── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.status = btn.dataset.status;
    refresh();
  };
});
$('btn-refresh').onclick = refresh;

async function refresh(){
  setMsg($('list-msg'), '');
  $('req-list').innerHTML = '<p class="note" style="margin:0">Loading…</p>';
  try {
    const r = await api({ action:'list_requests', password: state.password, status: state.status });
    if (!r.ok){
      return setMsg($('list-msg'), ERROR_MESSAGES[r.error] || r.message || 'Something went wrong.', 'err');
    }
    renderList(r.requests);
  } catch(e){
    setMsg($('list-msg'), 'Couldn’t connect. Please try again.', 'err');
  }
}

function renderList(requests){
  const list = $('req-list');
  list.innerHTML = '';
  if (!requests.length){
    list.innerHTML = '<p class="note" style="margin:0">Nothing here.</p>';
    return;
  }
  requests.slice().reverse().forEach(req => list.appendChild(renderCard(req)));
}

function fmtTime(iso){
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderCard(req){
  const card = document.createElement('div');
  card.className = 'req-card';

  let html = `
    <div class="req-top">
      <span class="req-name">${esc(req.employee_name)} (${esc(req.employee_code)})</span>
      <span class="req-date">${esc(req.business_date)}</span>
    </div>
    <span class="req-status ${esc(req.status)}">${esc(req.status)}</span>
    <div class="req-detail">Arrived ${esc(req.arrival_time)} @ ${esc(req.practice_loc_name || req.practice_loc_id)}</div>
  `;
  if (req.has_early_leave){
    html += `<div class="req-detail">Left early at ${esc(req.departure_time)}</div>`;
  }
  html += `<div class="req-reason">${esc(req.reason)}</div>`;
  if (req.status !== 'PENDING'){
    html += `<div class="req-review">Reviewed by ${esc(req.reviewed_by || '—')} at ${esc(fmtTime(req.reviewed_at))}${req.review_note ? ' — ' + esc(req.review_note) : ''}</div>`;
  }
  card.innerHTML = html;

  if (req.status !== 'PENDING') return card;

  const actions = document.createElement('div');
  actions.className = 'req-actions';
  const approveBtn = document.createElement('button');
  approveBtn.type = 'button'; approveBtn.className = 'btn-ok btn-sm'; approveBtn.textContent = 'Approve';
  const rejectBtn = document.createElement('button');
  rejectBtn.type = 'button'; rejectBtn.className = 'btn-danger btn-sm'; rejectBtn.textContent = 'Reject';
  actions.appendChild(approveBtn);
  actions.appendChild(rejectBtn);
  card.appendChild(actions);

  const sub = document.createElement('div');
  sub.className = 'subform hide';
  card.appendChild(sub);

  approveBtn.onclick = () => {
    const opening = sub.classList.contains('hide');
    sub.classList.add('hide'); sub.innerHTML = '';
    if (opening) { sub.appendChild(buildApproveForm(req, card, sub)); sub.classList.remove('hide'); }
  };
  rejectBtn.onclick = () => {
    const opening = sub.classList.contains('hide');
    sub.classList.add('hide'); sub.innerHTML = '';
    if (opening) { sub.appendChild(buildRejectForm(req, card, sub)); sub.classList.remove('hide'); }
  };

  return card;
}

function buildApproveForm(req, card, sub){
  const wrap = document.createElement('div');
  let summary = `This will create a Check In at ${esc(req.arrival_time)}`;
  if (req.has_early_leave) summary += ` and a Leave Early at ${esc(req.departure_time)}`;
  summary += ` @ ${esc(req.practice_loc_name || req.practice_loc_id)} on ${esc(req.business_date)}.`;

  wrap.innerHTML = `
    <p class="note" style="margin:0 0 10px">${summary}</p>
    <div class="field">
      <label>Note (optional)</label>
      <input class="a-note" type="text" placeholder="e.g. Confirmed with teammate">
    </div>
    <div id="a-msg"></div>
    <div class="subform-actions">
      <button type="button" class="btn-secondary a-cancel">Cancel</button>
      <button type="button" class="btn-ok a-confirm">Approve</button>
    </div>
  `;

  wrap.querySelector('.a-cancel').onclick = () => { sub.classList.add('hide'); sub.innerHTML = ''; };
  wrap.querySelector('.a-confirm').onclick = async () => {
    const msgEl = wrap.querySelector('#a-msg');
    const btn = wrap.querySelector('.a-confirm');
    btn.disabled = true; btn.textContent = 'Approving…';
    setMsg(msgEl, '');
    try {
      const r = await api({
        action: 'approve_request',
        password: state.password,
        request_id: req.request_id,
        reviewed_by: reviewedBy(),
        review_note: wrap.querySelector('.a-note').value.trim()
      });
      if (!r.ok){
        return setMsg(msgEl, ERROR_MESSAGES[r.error] || r.message || 'Something went wrong.', 'err');
      }
      refresh();
    } catch(e){
      setMsg(msgEl, 'Couldn’t connect. Please try again.', 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'Approve';
    }
  };

  return wrap;
}

function buildRejectForm(req, card, sub){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="field">
      <label>Reason (required)</label>
      <input class="r-note" type="text" placeholder="e.g. Not enough detail to confirm">
    </div>
    <div id="r-msg"></div>
    <div class="subform-actions">
      <button type="button" class="btn-secondary r-cancel">Cancel</button>
      <button type="button" class="btn-danger r-confirm">Reject</button>
    </div>
  `;

  wrap.querySelector('.r-cancel').onclick = () => { sub.classList.add('hide'); sub.innerHTML = ''; };
  wrap.querySelector('.r-confirm').onclick = async () => {
    const msgEl = wrap.querySelector('#r-msg');
    const note = wrap.querySelector('.r-note').value.trim();
    if (!note) return setMsg(msgEl, 'Please enter a reason.');

    const btn = wrap.querySelector('.r-confirm');
    btn.disabled = true; btn.textContent = 'Rejecting…';
    setMsg(msgEl, '');
    try {
      const r = await api({
        action: 'reject_request',
        password: state.password,
        request_id: req.request_id,
        reviewed_by: reviewedBy(),
        review_note: note
      });
      if (!r.ok){
        return setMsg(msgEl, ERROR_MESSAGES[r.error] || r.message || 'Something went wrong.', 'err');
      }
      refresh();
    } catch(e){
      setMsg(msgEl, 'Couldn’t connect. Please try again.', 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'Reject';
    }
  };

  return wrap;
}

/* ── Wiring ───────────────── */
$('btn-unlock').onclick = unlock;
$('f-password').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
$('btn-relock').onclick = () => {
  state.password = '';
  $('f-password').value = '';
  setMsg($('lock-msg'), '');
  show('lock');
};

show('lock');
</script>
</body>
</html>
