<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<title>Attendance Report</title>
<style>
  :root{
    --ink:#16202B;
    --ink-soft:#3A4753;
    --muted:#6B7780;
    --line:#D8DEDC;
    --paper:#EFF2F1;
    --card:#FFFFFF;
    --ok:#0F6E4F;
    --ok-bg:#E4F1EB;
    --warn:#9A4C15;
    --warn-bg:#FBEEE2;
    --err:#9B2C2C;
    --err-bg:#FBEAEA;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.6;
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px 40px}

  .band{background:var(--ink);color:#fff;margin:0 -16px 20px;padding:18px 20px 16px}
  .band .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:#8FA2B0;margin:0 0 4px;
  }
  .band .title{font-size:21px;font-weight:600;margin:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
  h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .note{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.55}

  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
  .field{margin-bottom:14px}
  input,select{
    width:100%;padding:12px;font-size:16px;font-family:inherit;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  input:disabled,select:disabled{background:#F3F5F4;color:var(--muted)}
  .row{display:flex;gap:10px}
  .row .field{flex:1 1 0}

  button{
    font-family:inherit;font-size:16px;font-weight:600;
    border-radius:10px;border:1px solid transparent;
    cursor:pointer;width:100%;padding:14px;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-secondary{background:#fff;border-color:var(--line);color:var(--ink-soft)}

  .msg{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px;line-height:1.55}
  .msg.err{background:var(--err-bg);color:var(--err)}
  .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .hide{display:none}

  .result a{color:var(--ok);font-weight:600}
  .spacer{height:12px}
</style>
</head>
<body>
<div class="wrap">

  <div class="band">
    <p class="eyebrow">Admin only</p>
    <p class="title">Attendance Report</p>
  </div>

  <!-- Step 1: unlock -->
  <section id="scr-lock" class="card">
    <h2>Password</h2>
    <p class="note">This page shows every employee's hours, so it's protected by an admin password.</p>
    <div id="lock-msg"></div>
    <div class="field">
      <input id="f-password" type="password" autocomplete="off" placeholder="Report password">
    </div>
    <button class="btn-primary" id="btn-unlock">Unlock</button>
  </section>

  <!-- Step 2: filters + generate -->
  <section id="scr-form" class="card hide">
    <h2>Filters</h2>
    <div id="form-msg"></div>

    <div class="field">
      <label for="f-location">Practice Location (category)</label>
      <select id="f-location">
        <option value="">All locations</option>
      </select>
    </div>

    <div class="field">
      <label for="f-employee">Employee</label>
      <select id="f-employee">
        <option value="">All employees</option>
      </select>
    </div>

    <div class="row">
      <div class="field">
        <label for="f-start">From</label>
        <input id="f-start" type="date">
      </div>
      <div class="field">
        <label for="f-end">To</label>
        <input id="f-end" type="date">
      </div>
    </div>

    <button class="btn-primary" id="btn-generate">Generate Report</button>
    <div class="spacer"></div>
    <button class="btn-secondary" id="btn-relock">Lock again</button>
  </section>

  <!-- Result -->
  <section id="scr-result" class="card hide">
    <h2>Done</h2>
    <div id="result-msg" class="result"></div>
    <div class="spacer"></div>
    <button class="btn-secondary" id="btn-again">Run another report</button>
  </section>

</div>

<script>
/* ══════════════════════════════════════════
   Config — same backend as index.html
   ══════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzevhLv-1CXcH3yhRgHTt6v1vQ7opNhP1dEkQzmni_x6tAXnCOIbShW4pjd9Mjs882EBQ/exec',
  FETCH_TIMEOUT_MS: 25000
};

const $ = id => document.getElementById(id);

function show(name){
  ['lock','form','result'].forEach(s =>
    $('scr-'+s).classList.toggle('hide', s !== name));
}
function setMsg(el, text, kind){
  el.innerHTML = text ? `<div class="msg ${kind||'err'}">${esc(text)}</div>` : '';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(payload){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

const state = { password: '' };

/* ── Step 1: unlock ───────────────────── */
async function unlock(){
  const pw = $('f-password').value;
  if (!pw) return setMsg($('lock-msg'), 'Please enter the report password.');

  const btn = $('btn-unlock');
  btn.disabled = true; btn.textContent = 'Checking…';
  setMsg($('lock-msg'), '');

  try {
    const r = await api({ action:'report_meta', password: pw });
    if (!r.ok){
      const m = { BAD_PASSWORD: 'Incorrect password.' };
      return setMsg($('lock-msg'), m[r.error] || r.message || 'Something went wrong.');
    }
    state.password = pw;
    populateSelect('f-location', r.locations, l => [l.id, l.label], true);
    populateSelect('f-employee', r.employees, e => [e.code, e.name], true);

    const today = new Date();
    const p = n => String(n).padStart(2,'0');
    const todayStr = `${today.getFullYear()}-${p(today.getMonth()+1)}-${p(today.getDate())}`;
    if (!$('f-start').value) $('f-start').value = todayStr;
    if (!$('f-end').value) $('f-end').value = todayStr;

    show('form');
  } catch(e){
    setMsg($('lock-msg'), 'Couldn’t connect. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

function populateSelect(id, items, mapFn, keepFirst){
  const sel = $(id);
  const first = keepFirst ? sel.querySelector('option') : null;
  sel.innerHTML = '';
  if (first) sel.appendChild(first);
  items.forEach(item => {
    const [value, label] = mapFn(item);
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = label;
    sel.appendChild(opt);
  });
}

/* ── Step 2: generate ───────────────────── */
async function generate(){
  const start = $('f-start').value;
  const end = $('f-end').value;
  if (!start || !end) return setMsg($('form-msg'), 'Please choose both a start and end date.');
  if (start > end) return setMsg($('form-msg'), 'The start date must be before the end date.');

  const btn = $('btn-generate');
  btn.disabled = true; btn.textContent = 'Generating…';
  setMsg($('form-msg'), '');

  try {
    const r = await api({
      action: 'report',
      password: state.password,
      practice_loc_id: $('f-location').value,
      employee_code: $('f-employee').value,
      start_date: start,
      end_date: end
    });

    if (!r.ok){
      const m = {
        BAD_PASSWORD: 'Incorrect password — please lock and unlock again.',
        NO_DATA: 'No matching punches were found for this filter.',
        BAD_RANGE: 'Please select a valid date range.',
        RANGE_TOO_LARGE: 'Please select a range of 366 days or fewer.'
      };
      return setMsg($('form-msg'), m[r.error] || r.message || 'Something went wrong.', 'err');
    }

    $('result-msg').innerHTML =
      `<p>Report written to the <strong>report</strong> sheet: ${r.employee_count} employee(s) × ${r.date_count} day(s).</p>` +
      `<p><a href="${r.sheet_url}" target="_blank" rel="noopener">Open the spreadsheet</a></p>`;
    show('result');
  } catch(e){
    setMsg($('form-msg'), 'Couldn’t connect. Please try again.', 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Generate Report';
  }
}

/* ── Wiring ───────────────── */
$('btn-unlock').onclick = unlock;
$('f-password').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
$('btn-generate').onclick = generate;
$('btn-again').onclick = () => show('form');
$('btn-relock').onclick = () => {
  state.password = '';
  $('f-password').value = '';
  setMsg($('lock-msg'), '');
  show('lock');
};

show('lock');
</script>
</body>
</html>
