<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<title>Update Notice</title>
<style>
  :root{
    --ink:#16202B;
    --ink-soft:#3A4753;
    --muted:#6B7780;
    --line:#D8DEDC;
    --paper:#EFF2F1;
    --card:#FFFFFF;
    --ok:#0F6E4F;
    --ok-bg:#E4F1EB;
    --err:#9B2C2C;
    --err-bg:#FBEAEA;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.6;
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px 40px}

  .back-link{display:inline-block;font-size:13.5px;color:var(--muted);text-decoration:none;margin-bottom:12px}
  .back-link:active{color:var(--ink-soft)}

  .band{background:var(--ink);color:#fff;margin:0 -16px 20px;padding:18px 20px 16px}
  .band .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:#8FA2B0;margin:0 0 4px;
  }
  .band .title{font-size:21px;font-weight:600;margin:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
  h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--ink-soft)}
  .note{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.55}

  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
  .field{margin-bottom:14px}
  input,textarea{
    width:100%;padding:12px;font-size:16px;font-family:inherit;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  textarea{min-height:120px;resize:vertical;line-height:1.5}
  input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}

  button{
    font-family:inherit;font-size:16px;font-weight:600;
    border-radius:10px;border:1px solid transparent;
    cursor:pointer;width:100%;padding:14px;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-secondary{background:#fff;border-color:var(--line);color:var(--ink-soft)}

  .msg{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px;line-height:1.55}
  .msg.err{background:var(--err-bg);color:var(--err)}
  .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .hide{display:none}
  .spacer{height:12px}
  .char-count{font-size:12.5px;color:var(--muted);text-align:right;margin-top:-8px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="admin.html">← Admin</a>

  <div class="band">
    <p class="eyebrow">Admin only</p>
    <p class="title">Update Notice</p>
  </div>

  <!-- Step 1: unlock -->
  <section id="scr-lock" class="card">
    <h2>Password</h2>
    <p class="note">Same password as the other admin tools.</p>
    <div id="lock-msg"></div>
    <div class="field">
      <input id="f-password" type="password" autocomplete="off" placeholder="Admin password">
    </div>
    <button class="btn-primary" id="btn-unlock">Unlock</button>
  </section>

  <!-- Step 2: edit -->
  <section id="scr-form" class="card hide">
    <h2>What's new</h2>
    <p class="note">
      Shown once to every player on the check-in screen, the next time they open it after you save a change here.
      Leave it blank and save to stop showing anything.
    </p>
    <div id="form-msg"></div>
    <div class="field">
      <label for="f-message">Message</label>
      <textarea id="f-message" placeholder="e.g. Updated: Check In is now selected by default when you open the page."></textarea>
    </div>
    <p class="char-count" id="char-count">0 / 500</p>
    <button class="btn-primary" id="btn-save">Save</button>
    <div class="spacer"></div>
    <button class="btn-secondary" id="btn-relock">Lock again</button>
  </section>

</div>

<script>
/* ══════════════════════════════════════════
   Config — same backend as index.html / report.html / schedule.html
   ══════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzevhLv-1CXcH3yhRgHTt6v1vQ7opNhP1dEkQzmni_x6tAXnCOIbShW4pjd9Mjs882EBQ/exec',
  FETCH_TIMEOUT_MS: 25000,
  MAX_LEN: 500
};

const $ = id => document.getElementById(id);

function show(name){
  $('scr-lock').classList.toggle('hide', name !== 'lock');
  $('scr-form').classList.toggle('hide', name !== 'form');
}
function setMsg(el, text, kind){
  el.innerHTML = text ? `<div class="msg ${kind||'err'}">${esc(text)}</div>` : '';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(payload){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

const state = { password: '' };

function updateCharCount(){
  $('char-count').textContent = `${$('f-message').value.length} / ${CONFIG.MAX_LEN}`;
}
$('f-message').addEventListener('input', () => {
  if ($('f-message').value.length > CONFIG.MAX_LEN) {
    $('f-message').value = $('f-message').value.slice(0, CONFIG.MAX_LEN);
  }
  updateCharCount();
});

/* ── Step 1: unlock ───────────────────── */
async function unlock(){
  const pw = $('f-password').value;
  if (!pw) return setMsg($('lock-msg'), 'Please enter the admin password.');

  const btn = $('btn-unlock');
  btn.disabled = true; btn.textContent = 'Checking…';
  setMsg($('lock-msg'), '');

  try {
    const r = await api({ action:'get_notice', password: pw });
    if (!r.ok){
      const m = { BAD_PASSWORD: 'Incorrect password.' };
      return setMsg($('lock-msg'), m[r.error] || r.message || 'Something went wrong.');
    }
    state.password = pw;
    $('f-message').value = r.message || '';
    updateCharCount();
    show('form');
  } catch(e){
    setMsg($('lock-msg'), 'Couldn’t connect. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

/* ── Step 2: save ───────────────────── */
async function save(){
  const btn = $('btn-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  setMsg($('form-msg'), '');

  try {
    const r = await api({ action:'set_notice', password: state.password, message: $('f-message').value.trim() });
    if (!r.ok){
      const m = { BAD_PASSWORD: 'Incorrect password — please lock and unlock again.' };
      return setMsg($('form-msg'), m[r.error] || r.message || 'Something went wrong.', 'err');
    }
    setMsg($('form-msg'), r.message
      ? 'Saved. Players will see this the next time they open the check-in page.'
      : 'Saved. The notice is now blank, so nothing will be shown.', 'ok');
  } catch(e){
    setMsg($('form-msg'), 'Couldn’t connect. Please try again.', 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
}

/* ── Wiring ───────────────── */
$('btn-unlock').onclick = unlock;
$('f-password').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
$('btn-save').onclick = save;
$('btn-relock').onclick = () => {
  state.password = '';
  $('f-password').value = '';
  setMsg($('lock-msg'), '');
  show('lock');
};

show('lock');
</script>
</body>
</html>
